name: Bug report
description: Report a reproducible product or documentation defect without sensitive data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, active-case details, personal data, or live tracker locations.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Safe reproduction steps
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Repository revision or release
